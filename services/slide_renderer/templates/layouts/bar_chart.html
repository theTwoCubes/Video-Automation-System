      <h2 class="{% if headline|length > 45 %}long-title{% endif %}">{{ headline|md }}</h2>
      <div class="bars-wrap">
        {% for bar in bars[:6] %}
        <div class="bar-row">
          <div class="bar-label">{{ (bar.label if bar is mapping else bar)|md }}</div>
          <div class="bar-track"><div class="bar-fill" style="width: {{ (bar.value if bar is mapping else 50)|e }}%"></div></div>
          <div class="bar-value">{{ (bar.display_value if bar is mapping else '')|e }}</div>
        </div>
        {% endfor %}
      </div>
