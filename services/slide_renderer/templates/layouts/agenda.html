      {% set agenda_headline = headline or 'What We Will Cover' %}
      <h2 class="{% if agenda_headline|length > 40 %}long-title{% endif %}">{{ agenda_headline|md }}</h2>
      <div class="agenda-list">
        {% for b in (items or bullets)[:7] %}
        <div class="agenda-item">
          <div class="agenda-num">{{ loop.index }}</div>
          <div class="agenda-text">{{ b|strip_leading_number|md }}</div>
        </div>
        {% endfor %}
      </div>
