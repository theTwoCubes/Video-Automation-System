<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
{% include "_fonts.html" %}

* { box-sizing: border-box; margin: 0; padding: 0; }
h1, h2, h3, .d-title { overflow-wrap: break-word; word-break: break-word; }

body {
  width: {{ width }}px; height: {{ height }}px;
  background: {{ bg }};
  font-family: "Outfit", sans-serif;
  color: {{ text_color }};
  overflow: hidden;
}
.diagram {
  width: {{ width }}px; height: {{ height }}px;
  position: relative;
  background: linear-gradient(180deg, #0D0D0D 0%, #17121F 100%);
}
/* Chrome borders, match the thumbnail / slide frame */
.chrome-top    { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: {{ accent }}; z-index: 5; }
.chrome-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 5px; background: {{ secondary_accent }}; z-index: 5; }
.chrome-right  { position: absolute; top: 0; right: 0; bottom: 0; width: 12px; background: {{ accent }}; z-index: 5; }
.chrome-left   { position: absolute; top: 80px; left: 0; bottom: 80px; width: 8px; background: {{ accent }}; z-index: 5; }
.d-logo { position: absolute; bottom: 30px; right: 40px; z-index: 6; }
.d-logo img { height: 56px; width: auto; }
.d-title {
  position: absolute; top: 60px; left: 80px; right: 200px;
  font-size: 42px; font-weight: 700; color: {{ text_color }};
  line-height: 1.15; z-index: 2;
}
.d-title.long-title { font-size: 34px; }
.d-content {
  position: absolute; top: 180px; left: 80px; right: 80px; bottom: 80px;
  z-index: 2;
}

{% block extra_style %}{% endblock %}

@keyframes fadeIn { to { opacity: 1; } }
@keyframes popIn {
  0%   { opacity: 0; transform: scale(.8); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes slideDown {
  from { opacity: 1; transform: translateY(0); }
  to   { opacity: 0; transform: translateY(24px); }
}
@keyframes highlightPulse {
  0%, 100% { border-color: #1E2330; box-shadow: none; }
  50%      { border-color: {{ accent }}; box-shadow: 0 0 24px 0 {{ accent }}55; }
}
</style>
</head>
<body>
  <div class="diagram">
    <div class="chrome-top"></div>
    <div class="chrome-bottom"></div>
    <div class="chrome-right"></div>
    <div class="chrome-left"></div>
    <div class="d-title{% if title|length > 40 %} long-title{% endif %}">{{ title }}</div>
    <div class="d-content">
      {% block content %}{% endblock %}
    </div>
    {% if logo_b64 %}<div class="d-logo"><img src="data:image/png;base64,{{ logo_b64 }}" alt="Logo"></div>{% endif %}
  </div>
</body>
</html>
